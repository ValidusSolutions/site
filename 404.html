html,body{height:100%}

.bar{padding-block:26px}
.logo{position:relative;display:block;width:212px;height:66px}

p{font-size:clamp(17px,1.6vw,20px);line-height:1.6;margin:26px 0 38px;max-width:480px}
.btn{display:inline-block;font-weight:600;font-size:16px;line-height:1;padding:16px 30px;border-radius:6px;background:var(--yellow);color:var(--navy);transition:background .15s}
.btn:hover{background:#ffc15e}
footer{color:#8fa4bc;font-size:14px;padding-block:26px;background:#001e3c}
